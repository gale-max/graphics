[binaries]
c = '/usr/bin/aarch64-linux-gnu-gcc'
cpp = '/usr/bin/aarch64-linux-gnu-g++'
ar = '/usr/bin/aarch64-linux-gnu-ar'
strip = '/usr/bin/aarch64-linux-gnu-strip'
pkgconfig = '/usr/bin/pkg-config'

[host_machine]
system = 'linux'
cpu_family = 'aarch64'
cpu = 'armv8-a'
endian = 'little'

[properties]
needs_exe_wrapper = true
pkg_config_libdir = '/mnt/d/workspace/luna-workspace/os/graphics/pkgconfig'

[built-in options]
c_args = ['-fPIC', '-pthread', '-DLUNA_GRAPHICS=1', '-include', '/mnt/d/workspace/luna-workspace/os/graphics/include/luna_graphics_compat.h']
cpp_args = ['-fPIC', '-pthread', '-DLUNA_GRAPHICS=1', '-fno-exceptions', '-fno-rtti', '-include', '/mnt/d/workspace/luna-workspace/os/graphics/include/luna_graphics_compat.h']
c_link_args = ['-pthread']
cpp_link_args = ['-pthread']
