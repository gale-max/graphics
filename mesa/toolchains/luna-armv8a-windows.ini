[binaries]
c = 'D:/workspace/luna-workspace/tools/toolchains/aarch64-none-linux-gnu/bin/aarch64-none-linux-gnu-gcc.exe'
cpp = 'D:/workspace/luna-workspace/tools/toolchains/aarch64-none-linux-gnu/bin/aarch64-none-linux-gnu-g++.exe'
ar = 'D:/workspace/luna-workspace/tools/toolchains/aarch64-none-linux-gnu/bin/aarch64-none-linux-gnu-ar.exe'
strip = 'D:/workspace/luna-workspace/tools/toolchains/aarch64-none-linux-gnu/bin/aarch64-none-linux-gnu-strip.exe'
pkg-config = 'pkgconf.exe'

[host_machine]
system = 'linux'
cpu_family = 'aarch64'
cpu = 'armv8-a'
endian = 'little'

[properties]
needs_exe_wrapper = true
pkg_config_libdir = 'D:/workspace/luna-workspace/os/graphics/mesa/pkgconfig'

[built-in options]
c_args = ['-fPIC', '-pthread', '-DLUNA_GRAPHICS=1', '-include', 'D:/workspace/luna-workspace/os/graphics/libdrm/include/luna_graphics_compat.h']
cpp_args = ['-fPIC', '-pthread', '-DLUNA_GRAPHICS=1', '-fno-exceptions', '-fno-rtti', '-include', 'D:/workspace/luna-workspace/os/graphics/libdrm/include/luna_graphics_compat.h']
c_link_args = ['-pthread']
cpp_link_args = ['-pthread']

