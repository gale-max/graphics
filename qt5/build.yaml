project: luna-qt5

platforms:
  $include: ../platforms/armv8a-user.yaml

recipes:
  qt5_prepare:
    description: 下载并校验 Qt 5.15.19 qtbase 源码
    steps:
      - name: prepare_qtbase
        command: python
        args: [scripts/prepare.py]

  qt5_configure:
    description: 生成 Luna ARMv8A Qt qmake 配置
    steps:
      - name: configure_qt
        command: python
        args: [scripts/qt5_build.py, --stage, configure]

  qt5_core:
    description: 构建 QtCore
    steps:
      - name: build_qtcore
        command: python
        args: [scripts/qt5_build.py, --stage, core]

  qt5_gui_eglfs:
    description: 构建 QtGui 和 EGLFS 基础
    steps:
      - name: build_qtgui
        command: python
        args: [scripts/qt5_build.py, --stage, gui-eglfs]

  qt5_kms:
    description: 构建 EGLFS/KMS 平台插件
    steps:
      - name: build_qt_kms
        command: python
        args: [scripts/qt5_build.py, --stage, kms]

  qt5_eglfs_smoke:
    description: 构建 Luna ARMv8A Qt EGLFS 图形验收应用
    steps:
      - name: build_qt_eglfs_smoke
        command: python
        args: [scripts/qt5_build.py, --stage, smoke]

targets:
  qt5-prepare:
    build:
      recipe: qt5_prepare

  qt5-configure:
    build:
      recipe: qt5_configure

  qt5-core:
    build:
      recipe: qt5_core

  qt5-gui-eglfs:
    build:
      recipe: qt5_gui_eglfs

  qt5-kms:
    build:
      recipe: qt5_kms

  qt5-eglfs-smoke:
    build:
      recipe: qt5_eglfs_smoke
