# Qt qmake specification for the Luna ARMv8A user ABI.

MAKEFILE_GENERATOR      = UNIX
QMAKE_PLATFORM         = linux unix posix
CONFIG                 += incremental
QMAKE_INCREMENTAL_STYLE = sublib

include(@QT_MKSPECS@/common/linux.conf)
include(@QT_MKSPECS@/common/gcc-base-unix.conf)
include(@QT_MKSPECS@/common/g++-unix.conf)

QMAKE_CC                = @TOOLCHAIN@/aarch64-none-linux-gnu-gcc.exe
QMAKE_CXX               = @TOOLCHAIN@/aarch64-none-linux-gnu-g++.exe
QMAKE_LINK              = @TOOLCHAIN@/aarch64-none-linux-gnu-g++.exe
QMAKE_LINK_SHLIB        = @TOOLCHAIN@/aarch64-none-linux-gnu-g++.exe
QMAKE_AR                = @TOOLCHAIN@/aarch64-none-linux-gnu-ar.exe cqs
QMAKE_NM                = @TOOLCHAIN@/aarch64-none-linux-gnu-nm.exe -P
QMAKE_OBJCOPY           = @TOOLCHAIN@/aarch64-none-linux-gnu-objcopy.exe
QMAKE_STRIP              = @TOOLCHAIN@/aarch64-none-linux-gnu-strip.exe
QMAKE_SYSROOT            = @SYSROOT@

QMAKE_CFLAGS            += --sysroot=@SYSROOT@ -march=armv8-a -mtune=cortex-a53 -ffixed-x18 -fPIC
QMAKE_CXXFLAGS          += --sysroot=@SYSROOT@ -march=armv8-a -mtune=cortex-a53 -ffixed-x18 -fPIC
QMAKE_LFLAGS            += --sysroot=@SYSROOT@ -B@SYSROOT_LIB@ -L@SYSROOT_LIB@
QMAKE_INCDIR            += @MESA_INCLUDE@ @MESA_GBM_INCLUDE@ @LIBDRM_INCLUDE@ @LIBDRM_UAPI_INCLUDE@
QMAKE_INCDIR_OPENGL     = @MESA_INCLUDE@
QMAKE_INCDIR_OPENGL_ES2 = @MESA_INCLUDE@
QMAKE_INCDIR_EGL        = @MESA_INCLUDE@
QMAKE_INCDIR_DRM        = @LIBDRM_INCLUDE@ @LIBDRM_UAPI_INCLUDE@
QMAKE_INCDIR_GBM        = @MESA_GBM_INCLUDE@
QMAKE_LIBDIR            += @STAGING_LIB@
QMAKE_LIBDIR_OPENGL_ES2 = @STAGING_LIB@
QMAKE_LIBDIR_EGL        = @STAGING_LIB@
QMAKE_LIBDIR_GBM        = @STAGING_LIB@
QMAKE_LIBDIR_DRM        = @STAGING_LIB@
QMAKE_LIBS_OPENGL_ES2   = -lGLESv2 -lEGL -lgbm -lglapi -lexpat -ldrm
QMAKE_LIBS_EGL          = -lEGL -lgbm -lglapi -lexpat -ldrm
QMAKE_LIBS_GBM          = -lgbm -lglapi -lexpat -ldrm
QMAKE_LIBS_DRM          = -ldrm
QMAKE_LIBS              += -ldl -lpthread -ldrm

load(qt_config)
