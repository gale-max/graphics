# Qt qmake specification for the Luna ARMv8A user ABI.

MAKEFILE_GENERATOR      = UNIX
QMAKE_PLATFORM         = linux unix posix
CONFIG                 += incremental
QMAKE_INCREMENTAL_STYLE = sublib

include(D:/workspace/luna-workspace/os/graphics/qt5/upstream/qtbase-everywhere-src-5.15.19/mkspecs/common/linux.conf)
include(D:/workspace/luna-workspace/os/graphics/qt5/upstream/qtbase-everywhere-src-5.15.19/mkspecs/common/gcc-base-unix.conf)
include(D:/workspace/luna-workspace/os/graphics/qt5/upstream/qtbase-everywhere-src-5.15.19/mkspecs/common/g++-unix.conf)

QMAKE_CC                = D:/workspace/luna-workspace/tools/toolchains/aarch64-none-linux-gnu/bin/aarch64-none-linux-gnu-gcc.exe
QMAKE_CXX               = D:/workspace/luna-workspace/tools/toolchains/aarch64-none-linux-gnu/bin/aarch64-none-linux-gnu-g++.exe
QMAKE_LINK              = D:/workspace/luna-workspace/tools/toolchains/aarch64-none-linux-gnu/bin/aarch64-none-linux-gnu-g++.exe
QMAKE_LINK_SHLIB        = D:/workspace/luna-workspace/tools/toolchains/aarch64-none-linux-gnu/bin/aarch64-none-linux-gnu-g++.exe
QMAKE_AR                = D:/workspace/luna-workspace/tools/toolchains/aarch64-none-linux-gnu/bin/aarch64-none-linux-gnu-ar.exe cqs
QMAKE_NM                = D:/workspace/luna-workspace/tools/toolchains/aarch64-none-linux-gnu/bin/aarch64-none-linux-gnu-nm.exe -P
QMAKE_OBJCOPY           = D:/workspace/luna-workspace/tools/toolchains/aarch64-none-linux-gnu/bin/aarch64-none-linux-gnu-objcopy.exe
QMAKE_STRIP              = D:/workspace/luna-workspace/tools/toolchains/aarch64-none-linux-gnu/bin/aarch64-none-linux-gnu-strip.exe
QMAKE_SYSROOT            = D:/workspace/luna-workspace/tools/toolchains/aarch64-none-linux-gnu/aarch64-none-linux-gnu/libc

QMAKE_CFLAGS            += --sysroot=D:/workspace/luna-workspace/tools/toolchains/aarch64-none-linux-gnu/aarch64-none-linux-gnu/libc -march=armv8-a -mtune=cortex-a53 -ffixed-x18 -fPIC
QMAKE_CXXFLAGS          += --sysroot=D:/workspace/luna-workspace/tools/toolchains/aarch64-none-linux-gnu/aarch64-none-linux-gnu/libc -march=armv8-a -mtune=cortex-a53 -ffixed-x18 -fPIC
QMAKE_LFLAGS            += --sysroot=D:/workspace/luna-workspace/tools/toolchains/aarch64-none-linux-gnu/aarch64-none-linux-gnu/libc -BD:/workspace/luna-workspace/tools/toolchains/aarch64-none-linux-gnu/aarch64-none-linux-gnu/libc/usr/lib64 -LD:/workspace/luna-workspace/tools/toolchains/aarch64-none-linux-gnu/aarch64-none-linux-gnu/libc/usr/lib64
QMAKE_INCDIR            += D:/workspace/luna-workspace/os/graphics/mesa/upstream/include D:/workspace/luna-workspace/os/graphics/mesa/upstream/src/gbm/main D:/workspace/luna-workspace/os/graphics/libdrm/upstream D:/workspace/luna-workspace/os/graphics/libdrm/upstream/include/drm
QMAKE_INCDIR_OPENGL     = D:/workspace/luna-workspace/os/graphics/mesa/upstream/include
QMAKE_INCDIR_OPENGL_ES2 = D:/workspace/luna-workspace/os/graphics/mesa/upstream/include
QMAKE_INCDIR_EGL        = D:/workspace/luna-workspace/os/graphics/mesa/upstream/include
QMAKE_INCDIR_DRM        = D:/workspace/luna-workspace/os/graphics/libdrm/upstream D:/workspace/luna-workspace/os/graphics/libdrm/upstream/include/drm
QMAKE_INCDIR_GBM        = D:/workspace/luna-workspace/os/graphics/mesa/upstream/src/gbm/main
QMAKE_LIBDIR            += D:/workspace/luna-workspace/os/graphics/qt5/build/qt5-armv8a/staging/lib
QMAKE_LIBDIR_OPENGL_ES2 = D:/workspace/luna-workspace/os/graphics/qt5/build/qt5-armv8a/staging/lib
QMAKE_LIBDIR_EGL        = D:/workspace/luna-workspace/os/graphics/qt5/build/qt5-armv8a/staging/lib
QMAKE_LIBDIR_GBM        = D:/workspace/luna-workspace/os/graphics/qt5/build/qt5-armv8a/staging/lib
QMAKE_LIBDIR_DRM        = D:/workspace/luna-workspace/os/graphics/qt5/build/qt5-armv8a/staging/lib
QMAKE_LIBS_OPENGL_ES2   = -lGLESv2 -lEGL -lgbm -lglapi -lexpat -ldrm
QMAKE_LIBS_EGL          = -lEGL -lgbm -lglapi -lexpat -ldrm
QMAKE_LIBS_GBM          = -lgbm -lglapi -lexpat -ldrm
QMAKE_LIBS_DRM          = -ldrm
QMAKE_LIBS              += -ldl -lpthread -ldrm

load(qt_config)
